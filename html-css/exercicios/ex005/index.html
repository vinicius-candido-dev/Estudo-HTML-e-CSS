<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>formataçao de textos</title>
    <style>
        mark{
            background-color: rgb(22, 126, 41);
            }

    </style>



    
</head>
<body> 
    <h1>Principais formataçoes</h1>
    <p>exemplo semantico é <strong>'strong'</strong> e não semantico com <b>'b'</b></p>
    <p>em italico semantico seria <em>'em'</em>, e em  não semantico <i>'i'</i></p>
    <h2>texto marcardo</h2>
    <p>o termo asseguir esta marcado: <mark style="background-color: aqua;">bola </mark></p>
<h2>texto sobrescrito</h2>
         <p><mark>H<sub>2</sub>O</mark></p>
         <h2>texto sobscrito</h2>

     x <sup>20</sup>+5
</body>
</html>
